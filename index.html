<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScamWatch — Spot scams with on-device AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved appearance before paint to avoid theme/font flash.
      (function () {
        try {
          var raw = localStorage.getItem('forum-appearance');
          var prefs = raw
            ? JSON.parse(raw)
            : {
                theme: window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light',
                font: 'atkinson',
                fontSize: 'md',
              };
          var fonts = {
            sans: "'Inter', system-ui, -apple-system, sans-serif",
            serif: "'Georgia', 'Times New Roman', serif",
            mono: "ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace",
            atkinson: "'Atkinson Hyperlegible', system-ui, sans-serif",
            lexend: "'Lexend', system-ui, sans-serif",
            opensans: "'Open Sans', system-ui, sans-serif",
          };
          var scales = { sm: 0.9, md: 1, lg: 1.15 };
          var root = document.documentElement;
          if (prefs.theme === 'dark') root.classList.add('dark');
          root.style.setProperty('--app-font-family', fonts[prefs.font] || fonts.atkinson);
          root.style.setProperty('--app-font-scale', String(scales[prefs.fontSize] || 1));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
